# collective-football.urubasoftware.com — Production vhost
# This file is deployed to /etc/nginx/sites-available/ on Hetzner
# Symlinked from /etc/nginx/sites-enabled/
# 
# Prerequisites:
# 1. DNS A record: collective-football.urubasoftware.com → 89.167.119.59
# 2. SSL cert: certbot certonly --nginx -d collective-football.urubasoftware.com
# 3. Docker stack running on port 8002 (see docker-compose.prod.yml)

upstream cf_app {
    server 127.0.0.1:8002;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name collective-football.urubasoftware.com;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name collective-football.urubasoftware.com;

    ssl_certificate /etc/letsencrypt/live/collective-football.urubasoftware.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/collective-football.urubasoftware.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/uruba/collective-football/backend/public;
    index index.php;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Health check (load balancer probe)
    location = /health {
        access_log off;
        proxy_pass http://cf_app;
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
    }

    # WebSocket — Laravel Reverb
    location /app {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Horizon dashboard (restrict to internal/admin)
    location /horizon {
        allow 127.0.0.1;
        # Add your office/VPN IP ranges here
        deny all;
        proxy_pass http://cf_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Telescope (dev only — disabled in production env)
    location /telescope {
        deny all;
        return 403;
    }

    # API with rate limiting
    location /api/ {
        limit_req zone=cf_api burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://cf_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Static files
    location / {
        try_files $uri $uri/ @proxy;
    }

    location @proxy {
        proxy_pass http://cf_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri @proxy;
    }

    location ~ /\. { deny all; }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Logging
    access_log /var/log/nginx/collective-football.access.log;
    error_log /var/log/nginx/collective-football.error.log warn;
}

# Rate limiting zone (add to /etc/nginx/nginx.conf http block)
# limit_req_zone $binary_remote_addr zone=cf_api:20m rate=60r/m;

# collective.local — Host-based development (PHP running directly on host)
# Add to /etc/hosts: 127.0.0.1 collective.local
# Used when testing with host PHP (8.4/8.5) + host PostgreSQL

server {
    listen 80;
    server_name collective.local;
    root /var/www/collectiveFootball/backend/public;
    index index.php;

    add_header X-Env "host-dev";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location = /health {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # WebSocket — host Reverb
    location /app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\. { deny all; }
}

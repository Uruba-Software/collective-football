# collective.docker — Docker Compose development
# Add to /etc/hosts: 127.0.0.1 collective.docker

server {
    listen 80;
    server_name collective.docker localhost;
    root /var/www/backend/public;
    index index.php;

    add_header X-Env "docker-dev";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Docker internal DNS — allows nginx to start even when reverb isn't running
    resolver 127.0.0.11 valid=30s ipv6=off;

    location = /health {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # WebSocket → Reverb (dynamic upstream for graceful startup)
    location /app {
        set $reverb_backend reverb;
        proxy_pass http://$reverb_backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\. { deny all; }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
}

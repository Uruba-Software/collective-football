[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

; ─── Match Simulation Workers (RabbitMQ consumers) ───────────────────────────
; 4 workers for parallel headless match simulation

[program:match-worker-1]
command=php /var/www/backend/artisan queue:work rabbitmq --queue=match.simulate --sleep=3 --tries=3 --max-time=3600
directory=/var/www/backend
autostart=true
autorestart=true
startsecs=5
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/match-worker-1.log
environment=APP_ENV="production"

[program:match-worker-2]
command=php /var/www/backend/artisan queue:work rabbitmq --queue=match.simulate --sleep=3 --tries=3 --max-time=3600
directory=/var/www/backend
autostart=true
autorestart=true
startsecs=5
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/match-worker-2.log
environment=APP_ENV="production"

[program:match-worker-3]
command=php /var/www/backend/artisan queue:work rabbitmq --queue=match.simulate --sleep=3 --tries=3 --max-time=3600
directory=/var/www/backend
autostart=true
autorestart=true
startsecs=5
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/match-worker-3.log
environment=APP_ENV="production"

[program:match-worker-4]
command=php /var/www/backend/artisan queue:work rabbitmq --queue=match.simulate --sleep=3 --tries=3 --max-time=3600
directory=/var/www/backend
autostart=true
autorestart=true
startsecs=5
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/match-worker-4.log
environment=APP_ENV="production"

; ─── Result Processing Worker ─────────────────────────────────────────────────

[program:result-worker]
command=php /var/www/backend/artisan queue:work rabbitmq --queue=match.results --sleep=3 --tries=3 --max-time=3600
directory=/var/www/backend
autostart=true
autorestart=true
startsecs=5
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/result-worker.log

; ─── General Queue Worker ─────────────────────────────────────────────────────

[program:general-worker]
command=php /var/www/backend/artisan queue:work redis --queue=notifications,analytics,data.scrape --sleep=3 --tries=3
directory=/var/www/backend
autostart=true
autorestart=true
startsecs=5
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/general-worker.log

; ─── Laravel Scheduler (replaces cron) ───────────────────────────────────────

[program:scheduler]
command=php /var/www/backend/artisan schedule:work
directory=/var/www/backend
autostart=true
autorestart=true
startsecs=5
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/scheduler.log

; ─── Laravel Reverb WebSocket Server ─────────────────────────────────────────

[program:reverb]
command=php /var/www/backend/artisan reverb:start --host=0.0.0.0 --port=8080 --no-interaction
directory=/var/www/backend
autostart=true
autorestart=true
startsecs=5
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/reverb.log

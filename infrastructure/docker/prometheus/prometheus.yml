global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: 'collective-football'
    environment: 'local'

scrape_configs:
  # Laravel application metrics (via laravel-prometheus package)
  - job_name: 'collective-app'
    static_configs:
      - targets: ['nginx:80']
    metrics_path: '/metrics'

  # PostgreSQL metrics (via postgres_exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  # Redis metrics (via redis_exporter)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  # RabbitMQ metrics (built-in Prometheus plugin)
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

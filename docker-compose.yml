
# Collective Football — The Living Game
# Local Development Stack
# All services communicate on the 'collective' network

networks:
  collective:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  elasticsearch_data:
  grafana_data:
  prometheus_data:
  zabbix_data:
  sentry_data:
  sentry_postgres_data:

services:

  # ─── Database ────────────────────────────────────────────────────────────────

  postgres:
    image: postgis/postgis:16-3.4
    container_name: cf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: collective_football
      POSTGRES_USER: collective
      POSTGRES_PASSWORD: collective_secret
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5432:5432"
    networks:
      - collective
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collective -d collective_football"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Cache & Queue ───────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: cf_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - collective
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: cf_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: collective
      RABBITMQ_DEFAULT_PASS: collective_secret
      RABBITMQ_DEFAULT_VHOST: collective_football
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infrastructure/docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    ports:
      - "5672:5672"
      - "15672:15672"    # Management UI
    networks:
      - collective
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── Search ──────────────────────────────────────────────────────────────────

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: cf_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=collective-football
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - collective
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: cf_kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - collective
    depends_on:
      elasticsearch:
        condition: service_healthy
    profiles:
      - dev  # Only in dev, not prod

  # ─── Application ─────────────────────────────────────────────────────────────

  app:
    build:
      context: ./infrastructure/docker/php
      dockerfile: Dockerfile
    container_name: cf_app
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
      - ./infrastructure/docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - APP_ENV=local
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=collective_football
      - DB_USERNAME=collective
      - DB_PASSWORD=collective_secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=collective
      - RABBITMQ_PASS=collective_secret
      - RABBITMQ_VHOST=collective_football
      - ELASTICSEARCH_HOST=http://elasticsearch:9200
      - REVERB_HOST=0.0.0.0
      - REVERB_PORT=8080
    networks:
      - collective
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  reverb:
    build:
      context: ./infrastructure/docker/php
      dockerfile: Dockerfile
    container_name: cf_reverb
    restart: unless-stopped
    working_dir: /var/www/backend
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - ./backend:/var/www/backend
    environment:
      - APP_ENV=local
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - REVERB_HOST=0.0.0.0
      - REVERB_PORT=8080
    ports:
      - "8080:8080"
    networks:
      - collective
    depends_on:
      - app

  nginx:
    image: nginx:1.25-alpine
    container_name: cf_nginx
    restart: unless-stopped
    ports:
      - "8001:80"    # collective.docker:8001 (local — port 80 used by host Apache)
      - "8443:443"
    volumes:
      - ./backend:/var/www/backend
      - ./infrastructure/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./infrastructure/ssl:/etc/nginx/ssl
    networks:
      - collective
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Frontend Dev Server ──────────────────────────────────────────────────────

  vue-dev:
    image: node:20-alpine
    container_name: cf_vue_dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    networks:
      - collective
    profiles:
      - dev

  # ─── Monitoring ──────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: cf_prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
    volumes:
      - ./infrastructure/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - collective

  grafana:
    image: grafana/grafana:10.4.0
    container_name: cf_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: collective_admin
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/docker/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/docker/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    networks:
      - collective
    depends_on:
      - prometheus

  # ─── Error Tracking (GlitchTip — self-hosted Sentry alternative) ─────────────

  sentry-postgres:
    image: postgres:16-alpine
    container_name: cf_sentry_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: glitchtip_secret
    volumes:
      - sentry_postgres_data:/var/lib/postgresql/data
    networks:
      - collective

  glitchtip:
    image: glitchtip/glitchtip:latest
    container_name: cf_glitchtip
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://glitchtip:glitchtip_secret@sentry-postgres/glitchtip
      SECRET_KEY: collective_football_glitchtip_secret_key_change_in_prod
      REDIS_URL: redis://redis:6379/1
      DEFAULT_AUTO_FIELD: django.db.models.BigAutoField
      GLITCHTIP_DOMAIN: http://localhost:8090
    ports:
      - "8090:8080"
    networks:
      - collective
    depends_on:
      - sentry-postgres
      - redis

  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    container_name: cf_glitchtip_worker
    restart: unless-stopped
    command: ./bin/run-celery-with-beat.sh
    environment:
      DATABASE_URL: postgresql://glitchtip:glitchtip_secret@sentry-postgres/glitchtip
      SECRET_KEY: collective_football_glitchtip_secret_key_change_in_prod
      REDIS_URL: redis://redis:6379/1
    networks:
      - collective
    depends_on:
      - sentry-postgres
      - redis

  # ─── Infrastructure Monitoring (Zabbix) ──────────────────────────────────────

  zabbix-postgres:
    image: postgres:16-alpine
    container_name: cf_zabbix_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_secret
    volumes:
      - zabbix_data:/var/lib/postgresql/data
    networks:
      - collective

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-6.4-latest
    container_name: cf_zabbix_server
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: zabbix-postgres
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_secret
      ZBX_STARTPOLLERS: 5
    ports:
      - "10051:10051"
    networks:
      - collective
    depends_on:
      - zabbix-postgres

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-6.4-latest
    container_name: cf_zabbix_web
    restart: unless-stopped
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-postgres
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_secret
      PHP_TZ: Europe/Istanbul
    ports:
      - "8888:8080"
    networks:
      - collective
    depends_on:
      - zabbix-server
